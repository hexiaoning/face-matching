[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "face-matching"
version = "0.2.1"
description = "CUDA-only surveillance video face matching desktop application"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python>=4.10,<5",
  "onnxruntime-gpu[cuda,cudnn]>=1.21,<1.27",
  "PySide6>=6.8,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=6"]
build = ["pyinstaller>=6.21,<7"]

[project.scripts]
face-matching = "face_matching.app:main"
face-matching-download-models = "face_matching.model_manager:main"
face-matching-diagnose = "face_matching.diagnostics:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
