[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "face-matching"
version = "0.1.0"
description = "GPU-only desktop face identification for surveillance video"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
  "cryptography>=44.0,<47",
  "numpy>=2.0,<3",
  # ORT 1.27+ PyPI wheels default to CUDA 13. Keep the bundled runtime on
  # CUDA 12.x for broad RTX 40-series driver compatibility.
  "onnxruntime-gpu[cuda,cudnn]>=1.21,<1.27",
  "opencv-python-headless>=4.10,<5",
  "platformdirs>=4.3,<5",
  "PySide6-Essentials>=6.8,<7",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.9,<1",
]

[project.scripts]
face-matching = "face_matching.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/face_matching"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
