[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "face-matching"
version = "0.1.0"
description = "GPU-only surveillance video face matching desktop application"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26,<3",
    "opencv-python-headless>=4.10,<5",
    "PySide6>=6.8,<7",
]

[project.optional-dependencies]
gpu = [
    "onnxruntime-gpu[cuda,cudnn]>=1.21,<1.27",
]
dev = [
    "pytest>=8,<10",
]

[project.scripts]
face-matching = "face_matching.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
