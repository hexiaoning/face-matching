[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "surveillance-face-match"
version = "0.1.0"
description = "GPU-only desktop face matching for surveillance video"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
    "numpy>=2.0,<3",
    "opencv-python>=4.10,<5",
    "onnxruntime-gpu[cuda,cudnn]==1.26.0",
    "PySide6>=6.8,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.9,<1",
]

[project.scripts]
face-match = "face_match.app:main"

[tool.setuptools.packages.find]
include = ["face_match*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# GUI/thread boundaries must convert unexpected third-party errors into operator messages.
ignore = ["BLE001"]
