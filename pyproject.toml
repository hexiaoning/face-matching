[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "face-matching"
version = "2.9.0"
description = "Offline face matching, Chinese semantic search, person/vehicle detection and image enhancement for Windows"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10,<5",
  "PySide6>=6.8,<7",
  "onnxruntime-gpu[cuda,cudnn]>=1.24,<1.27",
  "openvino>=2025.3,<2027",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=6"]
build = ["pytest>=8.3", "pyinstaller>=6.15,<7"]

[project.scripts]
video-analysis = "face_matching.video_analysis:main"
face-matching = "face_matching.__main__:main"
face-matching-models = "face_matching.models:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
face_matching = ["resources/*.json", "resources/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
